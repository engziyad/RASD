# Behaviour spec: Kerberoasting with weak ticket encryption, as the domain controller records it.
# rasd certify proves the rule fires on every event of each variant, or prints one that slips past
# (docs/CERTIFY.md). Patterns are Python regular expressions matched in full; {i:text} is text with
# each ASCII letter in either case; {l:text} is every spelling the rule's case-insensitive comparison
# treats as text (where the spec mirrors one of the rule's values).
behaviour: >-
  The domain controller issues a service ticket (event 4769, status 0x0) encrypted with RC4 or DES for a
  service account, at the request of another machine: the ticket an attacker takes away to crack.

sources:
  - id: event-4769
    title: Microsoft Learn, 4769(S, F) A Kerberos service ticket was requested (encryption types 0x1, 0x3, 0x11, 0x12, 0x17, 0x18; status 0x0)
    url: https://learn.microsoft.com/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769
  - id: attack-kerberoasting
    title: MITRE ATT&CK, T1558.003 Kerberoasting
    url: https://attack.mitre.org/techniques/T1558/003/

define:
  weak: '0x17|0x18|0x1|0x3'
  loopback: '::1|127\.0\.0\.1|{l:::ffff:127.0.0.1}'
  krbtgt: '{l:krbtgt}'

variants:
  - name: RC4 or DES ticket as the domain controller writes it
    why: >-
      Encryption types 0x17 (RC4-HMAC), 0x18 (RC4-HMAC-EXP), 0x1 and 0x3 (DES) in the hexadecimal form of
      the event, status 0x0 [event-4769], for a service account requested from another machine [attack-kerberoasting].
    sources: [event-4769, attack-kerberoasting]
    event:
      EventID: '4769'
      TicketEncryptionType: '{weak}'
      Status: '0x0'
      ServiceName: {not: ['[\s\S]*\$', '{krbtgt}']}
      IpAddress: {not: '{loopback}', missing: true}
    examples:
      - EventID: 4769
        ServiceName: svc_sql
        TicketEncryptionType: '0x17'
        Status: '0x0'
        IpAddress: '::ffff:10.10.20.55'

  - name: Codes in another letter case or in decimal
    why: Pipelines and SIEM extractions write the same codes in upper case or as decimal numbers (23, 24, 1, 3 and 0).
    sources: [event-4769]
    event:
      EventID: '4769'
      TicketEncryptionType: '{i:0x17}|{i:0x18}|{i:0x1}|{i:0x3}|23|24|1|3'
      Status: '{i:0x0}|0'
      ServiceName: {not: ['[\s\S]*\$', '{krbtgt}']}
      IpAddress: {not: '{loopback}', missing: true}
    examples:
      - EventID: 4769
        ServiceName: svc_backup
        TicketEncryptionType: '23'
        Status: '0'
        IpAddress: '10.10.20.55'

  - name: AES tickets
    expect: quiet
    why: AES-128 and AES-256 (0x11, 0x12) are the normal encryption types since Windows Server 2008 [event-4769].
    reason: Only the weak types are this rule's concern; the volume correlation counts AES roasting.
    sources: [event-4769]
    event:
      EventID: '4769'
      TicketEncryptionType: '{i:0x11}|{i:0x12}|17|18'

  - name: Computer accounts and krbtgt
    expect: quiet
    why: Computer accounts end with $ and krbtgt is the ticket-granting service itself; neither is a roasting target [event-4769].
    reason: filter_machine and filter_krbtgt.
    sources: [event-4769]
    event:
      EventID: '4769'
      ServiceName: '[\s\S]*\$|{krbtgt}'

  - name: Requests from the domain controller itself
    expect: quiet
    why: A request from the loopback address comes from the domain controller's own services.
    reason: filter_local excludes the three loopback forms the event uses.
    sources: [event-4769]
    event:
      EventID: '4769'
      IpAddress: '{loopback}'
