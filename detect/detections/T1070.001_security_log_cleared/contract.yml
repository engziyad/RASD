# yaml-language-server: $schema=../../../schemas/contract.schema.json
detection_id: T1070.001_security_log_cleared
name: Security Audit Log Cleared (Event 1102)
maturity: siem-ready
owner: detection-engineering
primary_technique: attack.t1070.001
related_techniques: []
data_contract:
  required_logsource:
    product: windows
    service: security
  required_events:
  - Security Event ID 1102
  required_fields:
  - EventID
  optional_fields:
  - SubjectUserName
  - SubjectDomainName
  - Computer
  telemetry_risk:
    security_log_not_forwarded: critical
detection_logic:
  type: single-event
  confidence: high
  severity: high
  expected_noise: low
  blind_spots:
  - Attackers who stop the EventLog service or tamper with forwarding before clearing
  - Only the Security log; other logs are covered by System 104
  - Hosts whose Security log is not forwarded before the clear leave no copy to investigate
coverage_depth:
  level: high
  reason: 'Outcome-based: fires whenever the Security log is cleared, by any method'
risk_model:
  base_score: 60
  increase_if:
  - condition: host_is_critical
    add: 25
  - condition: outside_business_hours
    add: 10
  decrease_if:
  - condition: approved_change_window
    subtract: 20
validation:
  mutation_tests_required: true
  lab_emulation_available: false
  siem_backends:
  - splunk
  - kql
triage:
  first_checks:
  - Identify SubjectUserName and host
  - Check maintenance records
  - Look for the process-level clearing alert at the same time
  escalate_if:
  - No documented maintenance
  - Account is not a known build or admin account
response:
  l1_action: Identify SubjectUserName and host; check maintenance records
  l2_action: Rebuild the timeline from forwarded Security events before the clear; correlate with the process-level clearing
    alert
  ir_action: Treat the host as compromised; investigate the subject account across the estate
  evidence:
  - 1102 event
  - SIEM copy of Security events before the clear
  - Logon sessions of the subject user
  containment:
  - Treat the host as compromised
  - Recover forwarded logs
  - Investigate the subject account
governance:
  evidence_type:
  - detection rule
  - test results
  - generated SIEM query
  - ATT&CK mapping
  - response playbook
