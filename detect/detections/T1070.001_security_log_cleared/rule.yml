title: Security Audit Log Cleared (Event 1102)
id: 6688dad2-3d7a-491f-a5f0-49f0d657e78c
status: test
description: |
  Detects that the Security event log was actually cleared. Windows writes
  Security 1102 whenever the audit log is cleared, whatever tool or API was
  used, so this catches GUI and API clearing that the process-level rule
  cannot see. Pair it with T1070.001_event_log_clearing: one shows the
  attempt and who ran it, this one proves the log is gone.
references:
  - https://attack.mitre.org/techniques/T1070/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-1102
author: Ziyad (github.com/engziyad)
date: 2026-10-11
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 1102
  condition: selection
falsepositives:
  - Golden-image sealing and documented maintenance on known build hosts
level: high
