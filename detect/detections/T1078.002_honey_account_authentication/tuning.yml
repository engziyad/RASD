# yaml-language-server: $schema=../../../schemas/tuning.schema.json
detection_id: T1078.002_honey_account_authentication
expected_noise: low
noise_sources:
- A password audit or account-discovery tool run by the security team that authenticates as every account it finds
- A penetration test of the lab that was not told which accounts are decoys
tunings:
- id: declared_audit_host
  status: proposed
  scope: environment
  residual_risk: high
  reason: A quarterly password audit from the security team's jump host authenticates as every account, the decoys included, and would alert once per decoy per run.
  filter:
    WorkstationName: SEC-AUDIT01
  alternative: Do not filter the host. Register the audit window in the deception log and close the alerts as the declared audit; an attacker on the audit host would otherwise be invisible to every decoy.
never_tune:
- 'Never filter by outcome: a failed attempt means the lure was read, a successful one that the credential works.'
- 'Never filter by source address: the decoys are meant to catch any host, including trusted administration hosts.'
- 'Never drop a decoy from the rule without removing it from deceive/decoys.yml; rasd deceive --check fails on the difference.'
review:
  owner: detection-engineering
  cadence_days: 90
