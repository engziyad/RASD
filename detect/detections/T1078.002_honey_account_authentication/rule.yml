title: Deception - Authentication Attempt With a Honey Account
id: fc5660cb-a0f2-4100-b8d1-a0ef490f5dae
status: test
description: |
  Detects any authentication attempt as one of the decoy domain accounts RASD-Deceive plants
  (deceive/decoys.yml): a logon success or failure (4624, 4625), a Kerberos TGT request (4768)
  or pre-authentication failure (4771), or an NTLM credential validation (4776), whatever the
  outcome. The accounts exist only to be found - a description that points at a credentials file,
  Kerberos pre-authentication disabled for AS-REP roasting - and nobody uses them, so one event
  is a high-confidence signal: someone read the lure and tried the credential, sprayed the
  account list, or roasted the account. The decoy names come from the inventory; adopt your own
  with `rasd deceive --rename`.
references:
  - https://attack.mitre.org/techniques/T1078/002/
  - https://attack.mitre.org/techniques/T1558/004/
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4624
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4625
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4768
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4771
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4776
author: Ziyad (github.com/engziyad)
date: 2026-10-28
tags:
  - attack.initial-access
  - attack.persistence
  - attack.privilege-escalation
  - attack.stealth
  - attack.t1078.002
  - attack.credential-access
  - attack.t1558.004
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4624    # logon succeeded
      - 4625    # logon failed
      - 4768    # Kerberos TGT requested (AS-REQ), succeeded or failed
      - 4771    # Kerberos pre-authentication failed
      - 4776    # NTLM credential validation, succeeded or failed
    TargetUserName:           # the honey accounts of deceive/decoys.yml, as sAMAccountName or UPN
      - 'svc_backup_adm'
      - 'svc_backup_adm@*'
      - 'adm_helpdesk_tier2'
      - 'adm_helpdesk_tier2@*'
  condition: selection
falsepositives:
  - A password audit or account-discovery tool run by the security team that authenticates as every account it finds
  - A penetration test of the lab that was not told which accounts are decoys
level: high
