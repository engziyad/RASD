title: Suspicious Service Installation (PsExec-style / Command Services)
id: c36a647e-caeb-4c7d-894f-8b5a3619a350
status: test
description: |
  Detects new services (System 7045) whose binary path runs a command
  interpreter, lives in a user-writable or admin share path, or matches
  remote-execution tooling (PsExec, Impacket smbexec/psexec, CrackMapExec).
  Service creation is the backbone of most SMB lateral movement.
references:
  - https://attack.mitre.org/techniques/T1569/002/
  - https://attack.mitre.org/techniques/T1021/002/
author: Ziyad (github.com/engziyad)
date: 2026-10-09
tags:
  - attack.execution
  - attack.t1569.002
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  product: windows
  service: system
detection:
  selection_event:
    Provider_Name: 'Service Control Manager'
    EventID: 7045
  susp_path:
    ImagePath|contains:
      - '%COMSPEC%'
      - 'powershell'
      - 'mshta'
      - 'rundll32'
      - '\ADMIN$\'
      - '\127.0.0.1\'        # any UNC path to the loopback (\\127.0.0.1\C$ ...)
  susp_shell:              # the command interpreter as the service binary, with or without arguments:
    # cmd.exe, cmd /c ..., "C:\Windows\System32\cmd.exe" /Q /c ... (public data: services whose binary is a bare cmd.exe)
    ImagePath|re: '(?i)(^|[\\/"\s])cmd(\.exe)?("|\s|$)'
  susp_writable_path:      # any Temp folder (C:\Temp, Windows\Temp, a user's Temp), AppData, ProgramData, Public, Downloads; '\' or '/' separators
    ImagePath|re: '(?i)[\\/](AppData|ProgramData|Users[\\/]Public|Temp|Downloads)[\\/]'
  susp_script:             # CreateProcess runs .bat / .cmd through cmd.exe implicitly
    ImagePath|re: '(?i)\.(bat|cmd)\b'
  susp_name:               # default service names of remote-execution tools
    ServiceName|startswith:
      - 'PSEXESVC'           # Sysinternals PsExec
      - 'PAExec'             # PAExec (PAExec-<pid>-<host>)
      - 'RemComSvc'          # RemCom
      - 'csexecsvc'          # CSExec
      - 'BTOBTO'             # Impacket smbexec (older default)
  susp_random_exe:
    # Impacket psexec drops %SystemRoot%\<8 random chars>.exe
    ImagePath|re: '(?i)^(%SystemRoot%|[A-Za-z]:\\Windows)\\[A-Za-z]{8}\.exe$'
  filter_defender_driver:  # Defender's own kernel drivers, installed from its protected Definition Updates / Platform folders
    # (public data: MpKslDrv.sys under ProgramData\Microsoft\Windows Defender\Definition Updates\{GUID}\)
    ImagePath|re: '(?i)^[a-z]:\\ProgramData\\Microsoft\\Windows Defender\\(Definition Updates|Platform)\\[^\\]+\\[^\\]+\.sys$'
  condition: selection_event and 1 of susp_* and not filter_defender_driver
falsepositives:
  - Sysinternals PsExec used by administrators (correlate with change tickets)
level: high
