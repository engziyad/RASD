# yaml-language-server: $schema=../../../schemas/tuning.schema.json
detection_id: T1685.005_event_log_clearing
expected_noise: low
noise_sources:
- Golden-image and VDI build scripts that reset logs before sealing
tunings:
- id: backup_service_account
  status: rejected
  scope: environment
  residual_risk: high
  reason: A backup account clears logs after exporting them, so filtering it looks attractive.
  filter:
    User: CORP\svc_backup
  alternative: Suppress by build host and change window in the SIEM; a stolen service account is exactly what an intruder
    uses.
never_tune:
- 'Never filter by user: clearing logs is what an intruder does with a borrowed admin or service account.'
review:
  owner: detection-engineering
  cadence_days: 90
