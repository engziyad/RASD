# yaml-language-server: $schema=../../../schemas/contract.schema.json
detection_id: T1070.001_event_log_clearing
name: Windows Event Log Clearing via Command Line
maturity: siem-ready
owner: detection-engineering
primary_technique: attack.t1070.001
related_techniques: []
data_contract:
  required_logsource:
    product: windows
    category: process_creation
  required_events:
  - Sysmon Event ID 1 (ProcessCreate) - the generated KQL and SPL read Sysmon; Security 4688 works only after remapping NewProcessName and ParentProcessName in tools/mappings.yml, and has no OriginalFileName
  required_fields:
  - Image
  - CommandLine
  optional_fields:
  - User
  - ParentImage
  - OriginalFileName
  telemetry_risk:
    missing_commandline: critical
detection_logic:
  type: single-event
  confidence: high
  severity: high
  expected_noise: low
  blind_spots:
  - Clearing through Event Viewer or the Win32 API from a custom binary
  - Selective event deletion or killing EventLog threads
  - Clearing performed remotely (wevtutil /r:host) logs the process on the source, not the target
coverage_depth:
  level: medium
  reason: Command-line methods; the 1102 and 104 rules cover the outcome regardless of method
risk_model:
  base_score: 60
  increase_if:
  - condition: host_is_critical
    add: 20
  - condition: outside_business_hours
    add: 10
  - condition: user_is_privileged
    add: 10
  decrease_if:
  - condition: approved_change_window
    subtract: 20
validation:
  mutation_tests_required: true
  lab_emulation_available: true
  siem_backends:
  - splunk
  - kql
triage:
  first_checks:
  - Identify the user and host
  - Check the parent process
  - Check for 1102 or 104 on the same host
  escalate_if:
  - Any occurrence outside a documented maintenance window
  - Security or Sysmon log targeted
response:
  l1_action: Identify user, host and which log was targeted; check for a documented maintenance window
  l2_action: Recover the forwarded copy of the cleared log from the SIEM and review the hour before the clear; scope the account
    on other hosts
  ir_action: Treat the host as compromised; preserve remaining logs and memory; reset the account if activity is unexplained
  evidence:
  - Process creation event
  - Forwarded copies of logs from before the clear
  - User activity across other hosts
  containment:
  - Treat the host as compromised
  - Recover logs from the SIEM for the period before the clear
  - Scope the user account across the estate
governance:
  evidence_type:
  - detection rule
  - test results
  - generated SIEM query
  - ATT&CK mapping
  - response playbook
