title: Suspicious Process Access to LSASS Memory
id: 2a0b1b0e-af2b-4426-a58b-72866042c48c
status: test
description: |
  Detects a process opening a handle to lsass.exe with access rights commonly
  required to read its memory (credential dumping via MiniDumpWriteDump,
  procdump, comsvcs.dll, Mimikatz-style tooling). Only named Windows components,
  PowerShell listing processes through .NET and the Defender scanner are
  excluded - never a whole folder, because dumpers are dropped into System32 and
  System32 binaries are abused to dump.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/en-us/windows/win32/procthread/process-security-and-access-rights
author: Ziyad (github.com/engziyad)
date: 2026-10-09
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access_vm_read:   # any hex mask with the VM_READ bit (0x10) set: the second-lowest hex digit is odd
    GrantedAccess|re: '(?i)^0x[0-9a-f]*[13579bdf][0-9a-f]$'
  selection_access_decimal:   # pipelines that store the mask in decimal: a regex cannot test a bit there, so the known masks
    GrantedAccess:
      - '16'        # 0x10, VM_READ alone
      - '4112'      # 0x1010
      - '5136'      # 0x1410
      - '5176'      # 0x1438
      - '5178'      # 0x143a
      - '2097151'   # 0x1fffff
      - '2039807'   # 0x1f1fff
      - '2047999'   # 0x1f3fff
  filter_os_components:      # Windows components seen opening LSASS in normal operation, each by its full path
    SourceImage:
      - 'C:\Windows\System32\csrss.exe'
      - 'C:\Windows\System32\wininit.exe'
      - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
      - 'C:\Windows\SysWOW64\wbem\WmiPrvSE.exe'
  filter_process_listing:    # Windows PowerShell and its remoting host reading process details through .NET (Get-Process)
    SourceImage:
      - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
      - 'C:\Windows\System32\wsmprovhost.exe'
    GrantedAccess:
      - '0x1410'
      - '5136'
    CallTrace|contains: '\System.ni.dll+'   # the .NET Process class; Invoke-Mimikatz and P/Invoke code have no such frame
  filter_defender:
    SourceImage|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    SourceImage|endswith: '\MsMpEng.exe'
  condition: selection_target and 1 of selection_access_* and not 1 of filter_*
falsepositives:
  - EDR / AV / backup agents not covered by filters (tune by signed path)
  - Administrators creating LSASS dumps for Microsoft support cases
level: high
