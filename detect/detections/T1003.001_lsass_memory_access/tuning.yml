# yaml-language-server: $schema=../../../schemas/tuning.schema.json
detection_id: T1003.001_lsass_memory_access
expected_noise: low
noise_sources:
- EDR, AV and backup agents that open LSASS for inspection
- Administrators creating LSASS dumps for a Microsoft support case
tunings:
- id: windows_binaries
  status: applied
  selection: filter_system
  reason: System32 and SysWOW64 processes open LSASS during normal operation.
- id: defender_engine
  status: applied
  selection: filter_defender
  reason: The Defender scanner (MsMpEng.exe in its platform folder) inspects LSASS. Both path and name must match.
- id: lolbin_exception
  status: applied
  kind: exception
  selection: lolbin_exception
  reason: rundll32 and taskmgr live in System32 but are used to dump LSASS, so they are taken back out of filter_system.
- id: edr_agent_by_full_path
  status: proposed
  scope: environment
  residual_risk: low
  reason: An EDR agent installed under Program Files opens LSASS with full rights on every host.
  filter:
    SourceImage|startswith: C:\Program Files\Vendor EDR\
  alternative: Prefer the exact signed path of the agent binary over a folder prefix.
never_tune:
- 'Never allow-list by process name alone (MsMpEng.exe, procdump.exe): a renamed copy in a writable folder would pass.'
- 'Never filter rundll32.exe or taskmgr.exe: they are the LOLBins this rule exists for.'
review:
  owner: detection-engineering
  cadence_days: 90
