# yaml-language-server: $schema=../../../schemas/tuning.schema.json
detection_id: T1003.001_lsass_memory_access
expected_noise: medium   # until tuned per estate: the sources below open LSASS with the masks this rule reads
noise_sources:
- EDR, AV and backup agents that open LSASS for inspection
- Defender running from C:\Program Files\Windows Defender (builds without platform updates) and EDR sensors
- svchost-hosted services, Task Manager, WerFault and the Malicious Software Removal Tool on some builds
- PowerShell 7 (pwsh.exe) Get-Process: its .NET runtime has no System.ni.dll frame, so the process-listing filter does not apply
- VMware Tools, configuration managers (SCCM) and other management agents
- Cloud virtual machine agents (the Azure guest agent's log collector)
- Windows components outside the named list on builds not covered by public data (add them by full path)
- Administrators creating LSASS dumps for a Microsoft support case
tunings:
- id: windows_components
  status: applied
  selection: filter_os_components
  reason: csrss, wininit and the WMI provider host open LSASS in normal operation (public data shows them on the Splunk Attack
    Range and OTRF hosts). Each is named by its full path.
- id: powershell_process_listing
  status: applied
  selection: filter_process_listing
  reason: Get-Process in Windows PowerShell (and in a remoting session) reads every process with 0x1410 through the .NET
    Process class. The filter needs the System.ni.dll frame, so Invoke-Mimikatz (0x1010, no module behind the caller),
    P/Invoke code and Out-Minidump (full rights) still alert. The frame is the native image of .NET Framework's System.dll;
    where that image is not generated, and in PowerShell 7, Get-Process alerts - noise to tune per host, never a blind spot.
- id: defender_engine
  status: applied
  selection: filter_defender
  reason: The Defender scanner (MsMpEng.exe in its platform folder) inspects LSASS. Both path and name must match.
- id: edr_agent_by_full_path
  status: proposed
  scope: environment
  residual_risk: low
  reason: An EDR agent installed under Program Files opens LSASS with full rights on every host.
  filter:
    SourceImage|startswith: C:\Program Files\Vendor EDR\
  alternative: Prefer the exact signed path of the agent binary over a folder prefix.
- id: defender_program_files
  status: proposed
  scope: environment
  residual_risk: low
  reason: On builds without Defender platform updates the scanner runs from Program Files, outside the platform folder the
    applied filter names.
  filter:
    SourceImage: C:\Program Files\Windows Defender\MsMpEng.exe
  alternative: Keep the exact path; prefer installing the platform update, which moves the engine under the filter applied.
- id: azure_guest_agent
  status: proposed
  scope: environment
  residual_risk: low
  reason: On Azure virtual machines the guest agent's log collector reads LSASS with 0x1410 (public data, OTRF
    empire_smbexec_dcerpc_smb_svcctl). Only for estates on Azure.
  filter:
    SourceImage|startswith: C:\WindowsAzure\GuestAgent_
    SourceImage|endswith: \CollectGuestLogs.exe
  alternative: Pin the agent's version folder once it is known, and review it when the agent updates.
never_tune:
- 'Never allow-list by process name alone (MsMpEng.exe, procdump.exe): a renamed copy in a writable folder would pass.'
- 'Never filter a whole folder such as System32: public data shows a dumper dropped into System32 (nanodump), a fresh services.exe
  dumping through dbgcore (PPLdump) and rundll32 and Task Manager dumps - all from that folder.'
- 'Never filter PowerShell without the access mask and the .NET frame: Invoke-Mimikatz runs inside powershell.exe.'
review:
  owner: detection-engineering
  cadence_days: 90
