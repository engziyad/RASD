# yaml-language-server: $schema=../../../schemas/tuning.schema.json
detection_id: T1059.004_linux_suspicious_shell_execution
expected_noise: low
noise_sources:
- Installers and package builds that unpack helpers into /tmp and run them
- Provisioning scripts that pass small Base64 payloads to a shell
tunings:
- id: package_manager_helpers
  status: proposed
  scope: environment
  residual_risk: medium
  reason: Package maintainer scripts run from a temporary directory under dpkg or rpm.
  filter:
    ParentImage|endswith:
    - /dpkg
    - /rpm
  alternative: Narrow it to the temp-script branch only (a /bin/sh /var/tmp/rpm-tmp.* first argument) and to the full parent paths (/usr/bin/dpkg, /usr/bin/rpm), so a Base64 pipe or a /dev/shm binary under a package manager still alerts.
never_tune:
- Never filter Base64 piped into a shell by user or host - the provisioning scripts that do it are few and are excepted by their exact command line, never by account.
- Never filter binaries in /dev/shm.
review:
  owner: detection-engineering
  cadence_days: 90
