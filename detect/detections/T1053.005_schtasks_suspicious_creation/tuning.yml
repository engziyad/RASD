# yaml-language-server: $schema=../../../schemas/tuning.schema.json
detection_id: T1053.005_schtasks_suspicious_creation
expected_noise: medium
noise_sources:
- IT automation that schedules PowerShell maintenance scripts
- Office Click-to-Run registering Office's update and telemetry tasks from XML files under C:\ProgramData\Microsoft\ClickToRun
tunings:
- id: office_click_to_run
  status: proposed
  scope: environment
  residual_risk: low
  reason: 'Office Click-to-Run''s Integrator.exe runs schtasks /Create /XML with task XML files under C:\ProgramData\Microsoft\ClickToRun
    on every install and update (public data, held-out file H59 - six alerts in one capture).'
  filter:
    ParentImage|endswith: '\root\Integration\Integrator.exe'
    CommandLine|contains: '\ProgramData\Microsoft\ClickToRun\'
  alternative: Pin the full Click-to-Run path of Integrator.exe on your build, and keep the task name prefix Microsoft\Office\ in the filter.
- id: sccm_client
  status: proposed
  scope: environment
  residual_risk: medium
  reason: The SCCM client creates tasks that run PowerShell maintenance scripts.
  filter:
    ParentImage|endswith: \CCM\CcmExec.exe
  alternative: Allow-list by task name and script path together, never by task name alone.
- id: all_powershell_actions
  status: rejected
  scope: global
  residual_risk: high
  reason: Silencing every task whose action is PowerShell would remove most of the alert volume.
  filter:
    CommandLine|contains: powershell
  alternative: Tune per automation account and script path instead.
never_tune:
- 'Never filter remote creation as SYSTEM (/S with /RU SYSTEM): it is a lateral-movement pattern.'
review:
  owner: detection-engineering
  cadence_days: 90
