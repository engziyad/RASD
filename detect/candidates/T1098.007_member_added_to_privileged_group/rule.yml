title: Member Added to a Privileged Windows Group
id: 9414b9fd-5231-50df-a8e9-0a84ed400dc1
status: experimental
description: A Security record that a member was added to a global, local or universal security group whose name is one of the built-in privileged groups. Adding an account to such a group is the shortest way to give it lasting administrative rights. Rights granted through nested groups, delegation or other groups than those listed are not seen.
references:
- https://attack.mitre.org/techniques/T1098/007/
author: RASD-Agent (github.com/engziyad/RASD)
date: '2026-11-17'
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098.007
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
    - 4728
    - 4732
    - 4756
    TargetUserName:
    - Domain Admins
    - Enterprise Admins
    - Schema Admins
    - Administrators
    - Backup Operators
    - Account Operators
    - DnsAdmins
  condition: selection
falsepositives:
- 'Approved changes: a new administrator joining the team or a service account being set up'
- Identity management tools that re-apply group membership
level: high
