title: Web Server Process Starting a Shell or Script Host
id: 3f3c7c45-7215-5943-ae01-9001d99558a8
status: experimental
description: A web server or application server process starting the command shell, PowerShell or a Windows script host. A web application has no reason to do that, and it is what a web shell does with every command it is sent. A web shell that only reads or writes files inside the server process is not seen.
references:
- https://attack.mitre.org/techniques/T1505/003/
author: RASD-Agent (github.com/engziyad/RASD)
date: '2026-11-17'
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - \w3wp.exe
    - \httpd.exe
    - \nginx.exe
    - \php-cgi.exe
    - \tomcat9.exe
  selection_child:
  - Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
    - \cscript.exe
    - \wscript.exe
  - OriginalFileName:
    - Cmd.Exe
    - PowerShell.EXE
    - pwsh.dll
    - cscript.exe
    - wscript.exe
  condition: selection_parent and selection_child
falsepositives:
- Web applications built to run system commands, such as deployment panels and some monitoring pages
- CGI scripts written as batch or PowerShell files
level: high
