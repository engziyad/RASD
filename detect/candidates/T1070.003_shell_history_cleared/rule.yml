title: Shell History File Removed, Emptied or Redirected
id: 3d44ce33-8348-5a18-9e73-c12331a5093a
status: experimental
description: A shell history file deleted, shredded, truncated or linked to the null device, or a shell started to run the history clearing command. The history file is the first record of what an intruder typed, so removing it hides the session. Clearing typed inside an interactive shell is a shell built-in and starts no process.
references:
- https://attack.mitre.org/techniques/T1070/003/
author: RASD-Agent (github.com/engziyad/RASD)
date: '2026-11-17'
tags:
- attack.stealth
- attack.t1070.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_file:
    Image|endswith:
    - /rm
    - /shred
    - /truncate
    CommandLine|contains:
    - .bash_history
    - .zsh_history
  selection_link:
    Image|endswith: /ln
    CommandLine|contains|all:
    - /dev/null
    - _history
  selection_builtin:
    CommandLine|re: (?i)history\s+-c(\s|;|&|"|$)
  condition: 1 of selection_*
falsepositives:
- Provisioning and image templating scripts that empty the history before a machine image is taken
- Users who clear their own history out of habit
level: medium
