title: Ntdsutil Creating Install-From-Media Files of the Directory
id: c3d8a6f3-9cd8-530a-87cd-8307f075f975
status: experimental
description: Ntdsutil started with the install-from-media menu, which writes a copy of the directory database and the registry hives that decrypt it. On a domain controller this is every account hash of the domain in one folder. Copies of the database taken from a shadow copy or with other tools are not covered.
references:
- https://attack.mitre.org/techniques/T1003/003/
author: RASD-Agent (github.com/engziyad/RASD)
date: '2026-11-17'
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith: \ntdsutil.exe
  - OriginalFileName: ntdsutil.exe
  selection_ifm:
    CommandLine|re: (?i)(^|[\s"])ifm([\s"]|$)
  condition: selection_img and selection_ifm
falsepositives:
- Administrators creating install-from-media files to promote a new domain controller
level: high
