title: Local Account Created With Net User
id: 0610e161-ea33-5bc0-b80f-60af631f3b34
status: experimental
description: Net or net1 started with user and the add switch and no domain switch, which creates an account in the local account database of the host. A new local account is a simple way to keep access. Accounts created through the management console, PowerShell or the API start no net process.
references:
- https://attack.mitre.org/techniques/T1136/001/
author: RASD-Agent (github.com/engziyad/RASD)
date: '2026-11-17'
tags:
- attack.persistence
- attack.t1136.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
  - Image|endswith:
    - \net.exe
    - \net1.exe
  - OriginalFileName:
    - net.exe
    - net1.exe
  selection_user:
    CommandLine|re: (?i)\susers?\s
  selection_add:
    CommandLine|re: (?i)\s/add(\s|$)
  filter_domain:
    CommandLine|re: (?i)\s/do[a-z]*(\s|$)
  condition: all of selection_* and not filter_domain
falsepositives:
- Help desk staff and installers that create a local account or a local service account
- Build scripts that prepare a host image
level: medium
