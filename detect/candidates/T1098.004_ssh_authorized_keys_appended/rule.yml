title: SSH Authorized Keys File Appended To
id: eda161fe-9928-52dd-bba8-d11ef96da909
status: experimental
description: 'A command that appends to an authorized keys file: the tee program writing to it, or a shell whose command line redirects output onto the file. A key added there lets its owner log on as that user without the password, which is a quiet way to keep access. A key written by an editor or a configuration agent that opens the file itself is not seen.'
references:
- https://attack.mitre.org/techniques/T1098/004/
author: RASD-Agent (github.com/engziyad/RASD)
date: '2026-11-17'
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
  - Image|endswith: /tee
    CommandLine|contains: authorized_keys
  - Image|endswith:
    - /bash
    - /sh
    - /dash
    - /zsh
    CommandLine|re: (?i)>>\s*\S*authorized_keys
  condition: selection
falsepositives:
- Administrators and onboarding scripts that add a user's key
- Configuration management and cloud initialisation that write keys through a shell
level: medium
