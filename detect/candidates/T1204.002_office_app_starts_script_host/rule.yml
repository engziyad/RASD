title: Office Application Starting a Shell or Script Host
id: 1f4df9ed-b75b-5627-8b2a-86a7cc129ebe
status: experimental
description: Word, Excel, PowerPoint or Outlook starting the command shell, PowerShell, a Windows script host or the HTML application host. A document does this when a user opens it and its macro or embedded object runs, which is how a malicious file takes its first step. A document that runs code inside the Office process only is not seen.
references:
- https://attack.mitre.org/techniques/T1204/002/
author: RASD-Agent (github.com/engziyad/RASD)
date: '2026-11-17'
tags:
- attack.execution
- attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \outlook.exe
  selection_child:
  - Image|endswith:
    - \cmd.exe
    - \powershell.exe
    - \wscript.exe
    - \cscript.exe
    - \mshta.exe
  - OriginalFileName:
    - Cmd.Exe
    - PowerShell.EXE
    - wscript.exe
    - cscript.exe
    - MSHTA.EXE
  condition: selection_parent and selection_child
falsepositives:
- Signed macros and add-ins of the organisation that start a script on purpose
- Document management or mail-merge tools that drive Office and start helper scripts
level: high
