[sysmon:linux]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = <TimeCreated SystemTime=['"]
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC
TRUNCATE = 65536
KV_MODE = none
REPORT-rasd_fields = rasd_fields_event_code, rasd_fields_event_id, rasd_fields_computer, rasd_fields_data
EVAL-Image = replace(replace(replace(replace(replace('Image', "&lt;", "<"), "&gt;", ">"), "&quot;", "\""), "&apos;", "'"), "&amp;", "&")
EVAL-CommandLine = replace(replace(replace(replace(replace('CommandLine', "&lt;", "<"), "&gt;", ">"), "&quot;", "\""), "&apos;", "'"), "&amp;", "&")
