[RASD - alert export]
description = RASD alerts that fired. Run it over the lab window and export the result as CSV: that file is the --siem-alerts input of rasd evidence.
search = index=rasd_alerts sourcetype="rasd:alert" | eval ss_name=rasd_alert, host=alert_host | table _time ss_name host alert_hosts result_count first_event last_event | sort 0 _time
disabled = 0
enableSched = 0
dispatch.earliest_time = -24h
dispatch.latest_time = now

