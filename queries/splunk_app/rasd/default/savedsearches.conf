search = index=sysmon source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=1 | where (((match('Image', "(?i)\\\\wevtutil\\.exe$") OR lower('OriginalFileName')="wevtutil.exe") AND (match('CommandLine', "(?i)\\ cl\\ ") OR match('CommandLine', "(?i)\\ clear\\-log\\ "))) OR (((match('Image', "(?i)\\\\powershell\\.exe$") OR match('Image', "(?i)\\\\pwsh\\.exe$")) OR (lower('OriginalFileName')="powershell.exe" OR lower('OriginalFileName')="pwsh.dll")) AND (match('CommandLine', "(?i)Clear\\-EventLog") OR match('CommandLine', "(?i)Remove\\-EventLog") OR match('CommandLine', "(?i)Limit\\-EventLog") OR match('CommandLine', "(?i)\\.ClearLog\\("))) OR match('CommandLine', "(?i)cleareventlog")) | eval rasd_detection="T1685.005_event_log_clearing" | eval alert_host=coalesce(host, Computer, ComputerName, dvc, dest, TargetComputerName, WorkstationName, ClientAddress) | stats count as result_count earliest(_time) as first_event latest(_time) as last_event values(alert_host) as alert_hosts by rasd_detection | eval alert_host=mvindex(alert_hosts, 0)
disabled = 0
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 1
alert.severity = 5
alert.expires = 7d
action.logevent = 1
action.logevent.param.index = rasd_alerts
action.logevent.param.sourcetype = rasd:alert
action.logevent.param.source = rasd
action.logevent.param.event = rasd_alert="$name$" detection="T1685.005_event_log_clearing" alert_host="$result.alert_host$" alert_hosts="$result.alert_hosts$" result_count="$result.result_count$" first_event="$result.first_event$" last_event="$result.last_event$" trigger_time="$trigger_time$"

