name: RASD CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: RASD · Red → Detect → DFIR → Intel → Purple
    runs-on: ubuntu-latest
    env:
      NO_BANNER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # rasd diff compares against the base branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the rasd command
        run: |
          pip install -e .
          rasd --version
          mkdir -p reports

      - name: Code checks of the tools (ruff lint and security rules, mypy)
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          mypy

      - name: Full pipeline (lint, unit, tests, mutations, fuzz, prove, parity, correlate, nearmiss, tune, red, build, chain, links)
        run: rasd ci

      - name: Detection tests as JUnit
        if: always()
        run: rasd test --junit reports/junit.xml

      - name: PowerShell scripts parse cleanly
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Path red -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Shell scripts parse cleanly
        run: for f in $(find red -name '*.sh'); do bash -n "$f" || exit 1; done

      - name: Semantic diff against the base branch
        if: github.event_name == 'pull_request'
        run: rasd diff --base "origin/${{ github.base_ref }}" --fuzz

      - name: Benchmark (compiled engine vs reference interpreter, 20k synthetic events)
        run: rasd benchmark --generate 20000 --repeat 1 --compare --json reports/benchmark.json

      - name: Python runner dry run
        run: python red/run_red.py --platform web linux --lab-confirmed --target http://127.0.0.1:3000 --dry-run

      - name: Replay smoke test (single-event alerts, correlations, storylines)
        run: rasd replay samples/replay/lab-day.jsonl --assets samples/replay/assets.csv --users samples/replay/users.csv --html reports/replay.html --json reports/replay.json

      - name: Near-miss report on the replay corpus
        run: rasd nearmiss --json reports/nearmiss.json

      - name: Quality and chain summary
        if: always()
        run: |
          rasd score > reports/score.txt || true
          {
            echo '## Detection quality'; echo '```'; cat reports/score.txt; echo '```'
            echo '## Metrics'; cat docs/RASD_METRICS.md | sed -n '/^| Metric/,/^$/p'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if generated files are out of date
        run: |
          stale=$(git status --porcelain --untracked-files=all -- queries detect docs red dfir intel purple profiles README.md)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::Generated files are stale. Run 'rasd build' and commit the result."
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rasd-reports
          path: |
            reports/
            queries/
            detect/coverage/
            detect/quality/
            purple/
