name: RASD lab run
# One run, on a branch that is not for merging: this copy of the workflow replays the pinned public datasets with
# the rules of this commit and pushes the result onto the branch it ran from. The lab itself is the workflow of
# the same name on main.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rasd-datasets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  datasets:
    name: Public datasets, replayed with this commit's rules
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NO_BANNER: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the rasd command with the dataset readers
        run: pip install -e ".[datasets]"

      - name: Fetch the pinned files and verify every hash
        run: rasd datasets fetch

      - name: Replay every rule over them and keep the result
        run: rasd datasets run --write

      - name: The result is what the repository's rules give
        run: rasd datasets check

      - name: Push the result onto this branch
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed: the kept results already are what these rules give."
            exit 0
          fi
          git status --short | head -n 40
          git add --all
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "datasets: the public recordings replayed in workflow run $GITHUB_RUN_ID"
          git push --quiet origin "HEAD:$GITHUB_REF_NAME"
