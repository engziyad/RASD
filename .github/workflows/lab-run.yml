name: RASD lab run
# One run, on a branch that is not for merging: the Windows lab host alone, as the lab runs it, and then every
# process that opened lsass.exe since Sysmon was installed, as Windows holds the events and as Splunk's own
# LSASS search reads them.

# The lab on machines that exist for one run. Each job takes a GitHub-hosted runner, marks it as a RASD lab
# host (red/lab/README.md, Lab guard), installs Sysmon with the repository's configuration, runs the safe
# default red steps and uploads the run: results, collected artifacts and the exported telemetry.
# A last job turns the runs into evidence.md with `rasd evidence`, keeps the raw runs beside it in
# purple/lab_runs (these machines hold nothing private), drops the kept runs this one replaces, rebuilds the
# pages and pushes the result as a branch, lab-evidence/run-<id>, for a person to read and open as a pull
# request. Nothing reaches main from here, and the workflow starts only when a person starts it.
#
# A live SIEM is the choice of the person who starts the run. Typing "accept" in the splunk input puts a
# Splunk Enterprise beside each lab host for the length of the run (a container on the Linux hosts, the
# service on the Windows host), with the RASD apps of queries/splunk_app in it and no vendor add-on. The
# lab host's events reach it as they are written, its own scheduler raises the alerts, and red/lab/splunk_lab.py
# waits for them and saves them as the --siem-alerts input of `rasd evidence`. Without that word the lab runs
# as before, and the SIEM part of the Operational Score stays at zero for the evidence it makes.
#
# What a runner is not: joined to a domain. The Active Directory tests are skipped.
# Credential access and the Security-log clear never run here. The WinRM test opens its session on the
# lab host itself, and the decoy host is a container on the Linux lab host's own bridge network.

on:
  workflow_dispatch:
    inputs:
      splunk:
        description: "A live Splunk Enterprise beside each lab host. Type accept only if you have read the Splunk General Terms (https://www.splunk.com/en_us/legal/splunk-general-terms.html) and accept them."
        required: false
        default: ""
        type: string
      evidence_branch:
        description: "Push the evidence as a branch (lab-evidence/run-<id>). Untick to read the runs and push nothing."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  # Starting Splunk Enterprise is accepting its licence and the Splunk General Terms. Only the person who
  # starts a run can do that, by typing "accept" in the input above; anything else runs the lab without a SIEM.
  SPLUNK_TERMS: ${{ inputs.splunk == 'accept' && 'accept' || '' }}
  # One release of Splunk Enterprise on every host, each file pinned by its digest: the image on the Linux
  # hosts, the installer on the Windows host (which must also carry a valid signature of Splunk).
  SPLUNK_IMAGE: splunk/splunk:10.4.5@sha256:e8bd9fbd0c5f5dffc73d84fe62f60e69c1d811fd0c89b22a174a46ce99d2dc1b
  SPLUNK_MSI: https://download.splunk.com/products/splunk/releases/10.4.5/windows/splunk-10.4.5-de9225ad9740-windows-x64.msi
  SPLUNK_MSI_SHA256: 312a62e376393e6cb7ffda36822d67fbd772225f1330a409d614e064463a2fa3

concurrency:
  group: rasd-lab-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows lab host
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          persist-credentials: false

      - name: Mark this runner as a RASD lab host
        shell: powershell
        run: |
          [Environment]::SetEnvironmentVariable('RASD_LAB_HOST', $env:COMPUTERNAME, 'Machine')
          "lab host: $env:COMPUTERNAME"

      - name: Install Sysmon with the repository's configuration
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Sysmon.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'Sysmon'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Sysmon.zip' -OutFile $zip -UseBasicParsing
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          & (Join-Path $dir 'Sysmon64.exe') -accepteula -i red\lab\sysmon-rasd.xml
          Get-Service Sysmon64 | Format-Table -AutoSize

      - name: Install Splunk Enterprise on the lab host
        if: env.SPLUNK_TERMS == 'accept'
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'splunk.msi'
          curl.exe --silent --show-error --fail --location --output $msi $env:SPLUNK_MSI
          if ($LASTEXITCODE -ne 0) { throw 'the Splunk Enterprise installer could not be downloaded' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi).Hash.ToLower()
          "installer: $env:SPLUNK_MSI ($([math]::Round((Get-Item -LiteralPath $msi).Length / 1MB)) MB), SHA-256 $hash"
          if ($hash -ne $env:SPLUNK_MSI_SHA256) { throw 'the installer is not the file this workflow pins by its SHA-256' }
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          "signed by: $($signature.SignerCertificate.Subject) ($($signature.Status))"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Splunk') { throw 'the installer does not carry a valid signature of Splunk' }

          $bytes = New-Object byte[] 16
          [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $password = 'Lab-' + (($bytes | ForEach-Object { $_.ToString('x2') }) -join '')
          Write-Output "::add-mask::$password"
          "SPLUNK_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SPLUNK_PASSWORD = $password

          $splunk = 'C:\Program Files\Splunk'
          Add-MpPreference -ExclusionPath $splunk -ErrorAction SilentlyContinue
          $log = Join-Path $env:RUNNER_TEMP 'splunk-install.log'
          $started = Get-Date
          $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', "`"$msi`"", '/quiet', '/norestart', '/l*v', "`"$log`"",
            'AGREETOLICENSE=Yes', 'SPLUNKUSERNAME=admin', "SPLUNKPASSWORD=$password", 'INSTALL_SHORTCUT=0')
          "msiexec ended with $($install.ExitCode) after $([int]((Get-Date) - $started).TotalSeconds) s"
          if ($install.ExitCode -ne 0) { Get-Content -LiteralPath $log -Tail 40; throw 'Splunk Enterprise did not install' }
          foreach ($app in 'rasd', 'rasd_fields', 'rasd_forwarder') {
            Copy-Item -Recurse -Force -LiteralPath "queries\splunk_app\$app" -Destination "$splunk\etc\apps\"
          }
          Restart-Service -Name Splunkd -Force
          $url = 'https://127.0.0.1:8089'
          python red\lab\splunk_lab.py about --url $url --timeout 420 --terms "accepted for this run by the person who started it" --out (Join-Path $env:RUNNER_TEMP 'siem.json')
          if ($LASTEXITCODE -ne 0) { throw 'Splunk does not answer on its management port' }
          $probe = "rasd-siem-probe-$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"
          cmd.exe /c "echo $probe" | Out-Null
          python red\lab\splunk_lab.py ready --url $url --timeout 300 --search "index=sysmon source=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 $probe"
          if ($LASTEXITCODE -ne 0) { throw 'the Sysmon events of this host do not reach Splunk under the source and the fields the searches read' }
          "SPLUNK_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Plant the file decoys
        shell: powershell
        run: .\deceive\Deploy-RasdDecoys.ps1 -LabConfirmed -Files

      - name: Let the lab host accept a WinRM session from itself
        shell: powershell
        run: |
          Enable-PSRemoting -Force -SkipNetworkProfileCheck | Out-Null
          Set-Item -Path WSMan:\localhost\Client\TrustedHosts -Value $env:COMPUTERNAME -Force
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name LocalAccountTokenFilterPolicy -Value 1 -PropertyType DWord -Force | Out-Null
          try { Invoke-Command -ComputerName $env:COMPUTERNAME -ScriptBlock { "WinRM session on $env:COMPUTERNAME" } -ErrorAction Stop }
          catch { Write-Warning "no WinRM session to this host: $($_.Exception.Message)" }

      - name: The plan
        shell: powershell
        run: .\red\lab\Invoke-RasdLabRun.ps1 -LabConfirmed -FixReadiness -SiemWaitMinutes 0 -Target $env:COMPUTERNAME -DryRun

      - name: Lab run
        shell: powershell
        run: .\red\lab\Invoke-RasdLabRun.ps1 -LabConfirmed -FixReadiness -SiemWaitMinutes 0 -Target $env:COMPUTERNAME -OutDir (Join-Path $env:RUNNER_TEMP 'lab-windows')

      - name: What ran
        if: always()
        shell: powershell
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'lab-windows\emulation-results.json'
          if (Test-Path -LiteralPath $results) {
            (Get-Content -LiteralPath $results -Raw | ConvertFrom-Json) | Format-Table -Property test, step, status, cleanup, error -AutoSize -Wrap | Out-String -Width 220
          }

      - name: Ask Splunk what it alerted on
        if: always() && env.SPLUNK_URL != ''
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'lab-windows\emulation-results.json'
          $status = 0
          python red\lab\splunk_lab.py wait --url $env:SPLUNK_URL --results $results --out (Join-Path $env:RUNNER_TEMP 'siem-wait.txt')
          if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
          python red\lab\splunk_lab.py export --url $env:SPLUNK_URL --results $results --out (Join-Path $env:RUNNER_TEMP 'siem-alerts.csv')
          if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
          python red\lab\splunk_lab.py searches --url $env:SPLUNK_URL --show "RASD Health" --out (Join-Path $env:RUNNER_TEMP 'siem-searches.json')
          if ($LASTEXITCODE -ne 0) { $status = $LASTEXITCODE }
          python red\lab\splunk_lab.py feeds --url $env:SPLUNK_URL --sample --out (Join-Path $env:RUNNER_TEMP 'siem-feeds.json')
          "SIEM_STATUS=$status" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          exit 0

      - name: Who opened LSASS, as Windows holds it and as Splunk's search reads it
        if: always() && env.SPLUNK_URL != ''
        shell: powershell
        env:
          PYTHONUTF8: "1"
        run: |
          Start-Sleep -Seconds 420
          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-Sysmon/Operational'; Id = 10 } -ErrorAction SilentlyContinue
          $rows = @()
          foreach ($e in $events) {
            $x = [xml]$e.ToXml()
            $d = @{}
            foreach ($n in $x.Event.EventData.Data) { $d[$n.Name] = $n.'#text' }
            if ($d.TargetImage -notlike '*\lsass.exe') { continue }
            $modules = ($d.CallTrace -split '\|' | ForEach-Object { (($_ -split '\+')[0] -split '\\')[-1] }) -join '|'
            $rows += [pscustomobject]@{ utc = $d.UtcTime; source = $d.SourceImage; access = $d.GrantedAccess; user = $d.SourceUser; modules = $modules; trace = $d.CallTrace }
          }
          "process access events on lsass.exe in the Sysmon log: $($rows.Count), from $(($rows | Sort-Object utc | Select-Object -First 1).utc) to $(($rows | Sort-Object utc | Select-Object -Last 1).utc)"
          $rows | Group-Object source, access, user, modules | Sort-Object { ($_.Group | Sort-Object utc | Select-Object -First 1).utc } | ForEach-Object {
            $g = @($_.Group | Sort-Object utc)
            'WIN ' + ([pscustomobject]@{ count = $_.Count; first = $g[0].utc; last = $g[-1].utc; source = $g[0].source; access = $g[0].access; user = $g[0].user; modules = $g[0].modules; trace = $g[0].trace } | ConvertTo-Json -Compress)
          }
          $code = @'
          import json, os, sys
          sys.path.insert(0, os.path.join("red", "lab"))
          import splunk_lab
          splunk = splunk_lab.Splunk(os.environ["SPLUNK_URL"], "admin", os.environ["SPLUNK_PASSWORD"])
          saved = next(s for s in splunk.saved() if s["name"] == "RASD - T1003.001_lsass_memory_access")
          spl = str(saved["search"])
          cut = spl.find("| eval rasd_detection=")
          rows = splunk.search(spl[:cut] + " | table _time UtcTime SourceImage GrantedAccess SourceUser CallTrace _indextime", "0")
          print("events the LSASS search matches in Splunk, over all time:", len(rows))
          for r in rows:
              print("SPL " + json.dumps({k: v for k, v in r.items() if not k.startswith("_") or k in ("_time", "_indextime")}))
          every = splunk.search('index=sysmon source="XmlWinEventLog:Microsoft-Windows-Sysmon/Operational" EventCode=10 '
                                '| stats count min(_time) as first max(_time) as last by SourceImage GrantedAccess SourceUser', "0")
          for r in every:
              print("ALL " + json.dumps(r))
          runs = splunk.search('index=_internal sourcetype=scheduler savedsearch_name="RASD - T1003.001_lsass_memory_access" '
                               '| table _time status result_count scheduled_time | sort 0 _time', "0")
          for r in runs:
              print("RUN " + json.dumps(r))
          '@
          $script = Join-Path $env:RUNNER_TEMP 'who.py'
          [IO.File]::WriteAllText($script, ((($code -split "`n") | ForEach-Object { ($_ -replace "`r", '') -replace '^          ', '' }) -join "`n"))
          python $script

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: always()
        with:
          name: lab-windows
          path: |
            ${{ runner.temp }}/lab-windows.zip
            ${{ runner.temp }}/lab-windows.zip.sha256
            ${{ runner.temp }}/siem-*
            ${{ runner.temp }}/siem.json*
          if-no-files-found: warn

      - name: An alert the run expected did not come, or Splunk refused a search
        if: env.SIEM_STATUS != '' && env.SIEM_STATUS != '0'
        shell: powershell
        run: |
          Write-Output "::error::the live Splunk did not raise every alert the run expects, or a saved search failed: read 'Ask Splunk what it alerted on'."
          exit 1
