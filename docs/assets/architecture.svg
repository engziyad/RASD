<text x="760.0" y="694" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="normal" fill="#d7af87" text-anchor="middle">Code checks can fail a detection; only a lab run with a live SIEM can verify one.</text>
