# Threat groups whose published ATT&CK procedure examples include techniques RASD detects, or
# exercises with an offensive test and does not detect yet (those rank the detection backlog).
# Every entry links the ATT&CK group page that publishes the procedure; re-check it when
# ATT&CK releases a new version, because wording and IDs can change. tools/chain.py renders
# actor_tradecraft_map.md from this file and fails on a technique RASD does not know.
# last_checked: the date someone opened every source page and confirmed the rows (null = not yet).
# Technique IDs follow ATT&CK v19.2, like the rules; the v18 aliases are in attack_v18_aliases.yml.
last_checked: 2026-10-13
