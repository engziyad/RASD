    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
  holdout: H13
  quiet:
    T1053.005_schtasks_suspicious_creation:
      kind: blind-spot
      reason: Hiding tasks by deleting the TaskCache SD value is the registry-based 'hidden task' tradecraft the rule lists as a gap
        (it names TaskCache-based hidden tasks; here applied to existing tasks). The registrations themselves appear only as Schedule-service
        registry writes because the export keeps only reg.exe, cmd.exe and conhost.exe process creations, so no schtasks.exe /create
        is present either.
    T1218.011_rundll32_suspicious_execution:
      kind: telemetry
      reason: An argument-less rundll32.exe acting as the attacker's SYSTEM process is susp_noargs, but its own process-creation record
        (Image rundll32.exe), which the rule matches, is not in the file; it is visible only through the children's Parent* fields.
