# Public attack datasets RASD replays through every detection and correlation.
#
# Each file is pinned to a commit of its source repository and to its SHA-256; `rasd datasets
# fetch` downloads and verifies it, `rasd datasets run` replays it and compares the result with
# what is written here:
#   expect   detections whose behaviour is part of the recorded attack, checked event by event:
#            each must fire
#   also     every other detection that fires on the file, with the kind and the reason:
#            harness (the lab's test harness did it: automation that set up, launched and
#            cleaned up the recorded attack), benign (other legitimate activity did it: an
#            agent, a log reset) or false-positive (the behaviour did not happen). An alert
#            without an entry fails the run. With `where` (field: text it contains) the entry
#            explains only the alerts that match, for example a harness launcher beside the
#            recorded attack: the other alerts must be the attack (expect) or none (quiet)
#   quiet    detections for the file's technique that stay quiet: the kind (gap: public data
#            shows the behaviour and no rule reads it yet, with the next rule; scope: outside
#            what the rule is written to detect; blind-spot: a limit the rule documents;
#            telemetry: the event the rule reads is missing; negative: the file does not hold
#            the behaviour) and the reason - each re-checked on every run
#   overlap  earlier files that hold some of the same records (same record number, host,
#            channel and time), and why: alerts on those records are counted once
#   gaps     detections no public dataset exercises yet, and why
#   next     rules public data asks for: behaviours of covered techniques that no RASD rule reads
#            yet, each with the files that show them
#   holdout  a held-out file: added after the rule changes, its expect and quiet entries taken
#            unchanged from labels written before its first replay (datasets/holdout_labels.json);
#            missed and found record what the first replay did that the labels did not say
#   changed_after_replay  rules changed after these files were replayed: their result here is
#            in-sample
#   member   the file read inside a zip, with its own SHA-256; lfs: false marks a file its Git LFS
#            source keeps in the repository itself (downloaded from the raw host, or with --git)
# How the files are read and what a public dataset proves: datasets/README.md
format: 1
sources:
  splunk-attack-data:
    title: Splunk Attack Data
    home: https://github.com/splunk/attack_data
    repo: https://github.com/splunk/attack_data
    commit: eac2f8f675ec31a6618003399dcc53641524e673
    license: Apache-2.0
    license_file: datasets/LICENSES/splunk-attack-data.txt
    url: https://media.githubusercontent.com/media/splunk/attack_data/{commit}/{path}
    lfs: true
    redistribute: true
  otrf-security-datasets:
    title: OTRF Security-Datasets
    home: https://github.com/OTRF/Security-Datasets
    repo: https://github.com/OTRF/Security-Datasets
    commit: d9d40ef123d2c87d5d3df28c96bcab4f0faccc87
    license: MIT
    license_file: datasets/LICENSES/otrf-security-datasets.txt
    url: https://raw.githubusercontent.com/OTRF/Security-Datasets/{commit}/{path}
    lfs: false
    redistribute: true
  evtx-attack-samples:
