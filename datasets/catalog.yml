  sha256: c22994ec5fa481609dfbb3403dc51d803cb1f0665d3aab29da8f5e8a9766f4af
  size: 58587
  format: windows-xml
  profile: windows-security-4688
  technique: T1003.001
  title: LSASS credential-access samples from several hosts (WER dump, PPLBlade, mimikatz, PsExec), no Sysmon 10
  splunk:
