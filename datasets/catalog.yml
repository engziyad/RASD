- id: splunk/T1190/snapattack/snapattack_linux.log
  source: splunk-attack-data
  path: datasets/attack_techniques/T1190/snapattack/snapattack_linux.log
  sha256: 5a0b799e30cf4d85683ec737b7815309977e13a5481693005b7b628311bd409d
  size: 5830
  format: windows-xml
  profile: sysmon-native
  technique: T1190
  title: 'ActiveMQ and RocketMQ exploitation on Linux: a downloaded ELF and a netcat reverse shell'
  splunk:
    sourcetype: sysmon:linux
    source: Syslog:Linux-Sysmon/Operational
  holdout: H102
  quiet:
    T1059.004_linux_suspicious_shell_execution:
      kind: scope
      reason: 'Exploited services run Unix shell commands (T1059.004), but none is in the documented scope:

        - no Base64 is decoded; RocketMQ pipes plain `echo` output into sh (susp_b64_pipe needs a Base64 decode piped into the shell);

        - the downloaded ELF is written to and run from the ActiveMQ working directory, not /tmp, /var/tmp or /dev/shm (the README lists
        other writable directories as a coverage gap), and its own process start is not recorded;

        - each shell''s first argument is -c or nothing, not a temp-directory script.'
    T1595.003_api_auth_probing:
      kind: telemetry
      reason: The detection reads a web server or reverse-proxy access log (c-ip, cs-method, cs-uri-stem, sc-status); the file holds
        none, so it cannot see the exploitation. ActiveMQ and RocketMQ are exploited over their broker protocols, which an HTTP access
        log would not record. The Splunk XSLT upload is a handful of authenticated requests, not 401/403 probing across 5+ paths.
    T1190_object_id_enumeration:
      kind: telemetry
      reason: The detection reads a web server or reverse-proxy access log (c-ip, cs-method, cs-uri-stem, sc-status); the file holds
        none, so it cannot see the exploitation. Nothing indicates a numeric object-ID walk.
  overlap:
    splunk/T1190/linux_cve-2023-33246_rocketmq_exploitation/snapattack_linux: its RocketMQ record is a record of that file
    splunk/T1190/linux_suspicious_child_of_postgresql/snapattack_linux: its PostgreSQL record is that file's record (same host, record
      number and time), exported with other attributes on the Event element
