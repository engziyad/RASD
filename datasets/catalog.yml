      reason: Several LSASS-dumping attacks are recorded, but the rule reads only Sysmon EID 10 against lsass.exe, which the file lacks;
        the .dmp file creation (EID 11) is the README's complementary signal, not this rule's input.
    T1569.002_suspicious_service_installation:
      kind: telemetry
      reason: PsExec remote execution creates the default PSEXESVC service on the target (susp_name), but the rule reads System 7045
        / Security 4697 and the file has neither. The PPLBlade driver service (ImagePath under C:\users\user, not a listed writable
        path, no listed name) would not match a fingerprint even with 7045.
