  profile: sysmon-native
  technique: T1218.011
  title: Rundll32 abuse with Atomic Red Team
  splunk:
    sourcetype: XmlWinEventLog
    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
  expect:
  - T1218.011_rundll32_suspicious_execution
  - T1003.001_lsass_memory_access
  also:
    T1059.001_powershell_encoded_command:
      kind: harness
      reason: 'the lab''s test harness: Ansible runs every task over WinRM as encoded PowerShell - the WinRM launcher (cmd /C PowerShell
        ... -EncodedCommand), its module bootstrap, host setup tasks, and Invoke-AtomicTest three times: the prerequisites, the recorded
        attack and the cleanup. The alert on the second is how the recorded attack was started; the others are the harness. An estate
        managed with Ansible sees the same alerts (benign positives). Tuning by the automation account would hide the attack too, because
        the harness ran it as the same administrator: tune by the bootstrap''s exact command line and keep alerting on what it runs'
    T1021.006_wsmprovhost_suspicious_child:
      kind: harness
      reason: 'the lab''s test harness: Ansible''s WinRM connection starts every task as cmd /C PowerShell ... -EncodedCommand under
        winrshost.exe, the task that launched the recorded attack included. An estate managed with Ansible over WinRM sees the same
        alerts (benign positives); scope a tuning to the automation host and the launcher''s exact command line, never to the account
        the attack also ran as'
