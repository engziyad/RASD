- id: otrf/covenant_psremoting_command
  source: otrf-security-datasets
  path: datasets/atomic/windows/lateral_movement/host/covenant_psremoting_command.zip
  sha256: 4a2e0f9688c87a90b17b608ff38fb2230ceb7305ea0368703dcfe53269e3f096
  size: 359550
  member: covenant_psremoting_command_2020-08-06115603.json
  member_sha256: 2e749fa04bf44837d8bf78db303cdd1937b05e15f89f5cd67bb982f14f103de2
  format: nxlog-json
  profile: nxlog-windows
  technique: T1021.006
  title: Covenant command run through PowerShell remoting
  quiet:
    T1021.006_wsmprovhost_suspicious_child:
      kind: scope
      reason: 'Covenant runs its command inside the remoting host (wsmprovhost.exe) without starting a child process: nothing for a
        child-process rule to see. PowerShell script block logging (4104) on the target would show it'
  also:
    T1003.001_lsass_memory_access:
      kind: false-positive
      reason: 'the remoting host (wsmprovhost.exe) opened LSASS with an all-access mask (0x1f3fff) through the .NET Process class
        (System.ni.dll in the call trace) while Covenant''s command ran - no dump followed in the recorded events. The rule has alerted
        on it since the access test became a VM_READ bit test (0x1f3fff carries VM_READ and was on no fixed list). It is kept, not
        filtered: Out-Minidump opens LSASS the same way, and only the full mask separates it from the 0x1410 process listing the
        filter allows'
