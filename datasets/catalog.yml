- id: splunk/T1059.001/snapattack/snapattack
  source: splunk-attack-data
  path: datasets/attack_techniques/T1059.001/snapattack/snapattack.log
  sha256: 032234c9d1c8f150fac1b4047dd1dbb8018ae77e5a4f5796c05edf9f3cc68d4d
  size: 136185
  format: windows-xml
  profile: windows-security-4688
  technique: T1059.001
  title: 'SnapAttack PowerShell samples from many hosts: script blocks, a reverse shell and cradles in plain command lines'
  also:
    T1059.001_powershell_encoded_command:
      kind: benign
      where:
        CommandLine:
        - -s -NoLogo -NoProfile -EncodedCommand
      reason: the one encoded command in the file is Set-Location 'C:\', started by dllhost.exe with the switches Windows PowerShell
        uses for an out-of-process runspace (-Version 5.1 -s -NoLogo -NoProfile). Nothing in the record is an attack, so it is not counted
        as evidence, although upstream files the whole compilation as Cobalt Strike PowerShell
  quiet:
    T1059.001_powershell_encoded_command:
      kind: scope
      reason: the attack samples run PowerShell with plain commands - a TCP reverse shell, a Base64 decoding function, a binary in C:\Users\Public
        starting powershell -ExecutionPolicy Bypass -C, a download cradle piped to iex (in a 4104 script block) - and no encoded command,
        which is what this rule keys on
