    source: Syslog:Linux-Sysmon/Operational
  holdout: H103
  quiet:
    T1059.004_linux_suspicious_shell_execution:
      kind: scope
      reason: 'A web-app RCE running a Base64 dropper through sh -c is T1059.004 behaviour, but this record is outside the documented
        scope:

        - the decoded output is redirected into a file, not piped into sh/bash/dash/zsh/ksh (susp_b64_pipe);

        - Image /bin/dash is not under a temp directory (susp_tmp_binary);

        - the shell''s first argument is -c, not a temp-directory script (tmp_script_shell/tmp_script_path).

        The next step, starting /tmp/mBZXM, would match susp_tmp_binary, but its process creation is not in this Java-filtered export.'
    T1595.003_api_auth_probing:
      kind: telemetry
      reason: The detection reads a web server or reverse-proxy access log (c-ip, cs-method, cs-uri-stem, sc-status); the file holds
        none, so it cannot see the exploitation. Spring4Shell and the Spring Cloud Function SpEL injection are single crafted requests,
        so even with an access log they would not be 401/403 rejections on 5+ distinct paths per client.
    T1190_object_id_enumeration:
      kind: telemetry
      reason: The detection reads a web server or reverse-proxy access log (c-ip, cs-method, cs-uri-stem, sc-status); the file holds
        none, so it cannot see the exploitation. Nothing indicates a numeric object-ID walk.
