    commit: 4ceed2f4706daf601c212a8f91c113dd85349a2c
    license: GPL-3.0
    url: https://raw.githubusercontent.com/sbousseaden/EVTX-ATTACK-SAMPLES/{commit}/{path}
    lfs: false
    redistribute: false
