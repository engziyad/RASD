  T1218.011_rundll32_suspicious_execution: three LOLBAS proxy exports were added (zipfldr RouteTheCall, advpack RegisterOCX, pcwutl
    LaunchApplication)
  T1547.001_registry_run_key_persistence: C:\Windows\Tasks was added to the writable folders
  T1110.003_password_spray_burst: the base rule now also counts TGTs refused for unknown or disabled accounts (4768 0x6, 0x12) and failed
    logons for unknown accounts (4625 0xC0000064)
