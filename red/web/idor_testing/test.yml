id: idor_testing
name: Object-level authorization (IDOR / BOLA)
platform: web
mitre:
  technique: T1190
  technique_name: "Exploit Public-Facing Application"
  tactics: [initial-access]
  other:
    - framework: OWASP API Security Top 10 (2023)
      id: API1 Broken Object Level Authorization
objective: >
  Log in as one lab account and request objects that belong to other users by walking a
  small range of IDs. Every foreign object served is a broken object-level authorization
  finding, and the sequential-ID pattern it leaves in the logs is what the object-ID
  enumeration correlation must catch.
prerequisites:
  - A lab copy of the application on localhost or a private address (for example OWASP Juice Shop)
  - A lab test account, given to the test as RASD_LAB_EMAIL / RASD_LAB_PASSWORD environment variables
  - Web server or reverse-proxy access logs collected
safety:
  - Runs only with --lab-confirmed; refuses any target that resolves to a public address
  - Read-only GET requests for at most 20 object IDs (default 5)
  - Credentials are read from the environment, never from the command line
execution:
  - "export RASD_LAB_EMAIL=alice@lab.local RASD_LAB_PASSWORD=..."
  - "python3 red/run_red.py --test idor_testing --lab-confirmed --target http://127.0.0.1:3000"
  - The test logs in, notes the account's own basket ID, and requests baskets 1..5
steps:
  - id: walk_object_ids
    name: Read other users' objects with one account's token (IDs 1-5)
    script: emulate_idor.py
    parameters: [Target]
    detections: []
    correlations: [T1190_object_id_enumeration]
scripts:
  cleanup: cleanup.sh
telemetry:
  - source: Web server / reverse proxy access log
    event: "HTTP request · sequential object IDs"
    description: One authenticated session requesting /rest/basket/1, /2, /3 ... within seconds
    fields:
      c-ip: '<client address, 127.0.0.1 for an application on the same host>'
      cs-user-agent: 'RASD-Red/<marker>'
      cs-uri-stem: '/rest/basket/<n> for consecutive n'
      sc-status: '200 where authorization is broken'
    used_by: [T1190_object_id_enumeration]
logging:
  - "Access logs with an authenticated user or session identifier per request (most do not log one by default)"
dfir_artifacts:
  - artifact: Object access sequence
    location: Access logs for the session
    collect: "grep 'RASD-Red/<marker>' access.log | grep /rest/basket/"
    purpose: Which foreign objects were read - the scope of the data exposure
  - artifact: Findings file
    location: "$RASD_OUT_DIR/idor_testing-findings.json"
    collect: Written by the test
    purpose: The object IDs served to an account that does not own them

cleanup:
  actions:
    - Nothing is created on the target
  verify: No state changes on the target; nothing to remove locally except the findings file
sample_output:
  console: |
    [T1190] Read other users' objects with one account's token (IDs 1-5)
      FINDING  GET /rest/basket/1 (another user's object): HTTP 200: object served to a user who does not own it
      FINDING  GET /rest/basket/2 (another user's object): HTTP 200: object served to a user who does not own it
      ...
    5 check(s), 5 finding(s)
  scenarios:
    - correlation: T1190_object_id_enumeration
      scenario: lab emulation - baskets 1 to 5, one request every 0.2 seconds
dfir_playbook: dfir/playbooks/web_application_attack.md
purple_scenario: purple/scenarios/T1190_object_id_enumeration.md
