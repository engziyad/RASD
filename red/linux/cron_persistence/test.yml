id: cron_persistence
name: User crontab persistence
platform: linux
mitre:
  technique: T1053.003
  technique_name: Scheduled Task/Job - Cron
  tactics: [persistence, execution]
objective: >
  Add a crontab entry for the current user - the simplest persistence on Linux - and
  record what the host logs about it: the crontab process, the write to the spool file and
  the cron daemon's own log line. The entry only echoes the run marker to /dev/null.
  RASD has no Linux rule yet; the run tells you which telemetry a rule could use.
prerequisites:
  - Linux lab host with cron (Debian/Ubuntu) or cronie (RHEL) installed
  - "auditd with a watch on the cron spool (-w /var/spool/cron -p wa -k cron) and/or Sysmon for Linux"
safety:
  - Runs only with --lab-confirmed on a disposable lab host you own
  - "One line is added: */30 * * * * /bin/echo <marker> >/dev/null 2>&1 # <marker>"
  - The existing crontab is read completely before it is rewritten, so other entries are preserved
  - cleanup.sh removes exactly the lines containing the marker
execution:
  - "python3 red/run_red.py --test cron_persistence --lab-confirmed"
  - collect_artifacts.sh saves only the marker line (never the user's other entries)
  - cleanup.sh removes the line and confirms it is gone
steps:
  - id: crontab_entry
    name: Add a crontab line that echoes the marker every 30 minutes
    script: emulate_cron.sh
    detections: []
scripts:
  cleanup: cleanup.sh
  collect: collect_artifacts.sh
telemetry:
  - source: auditd
    event: "SYSCALL / EXECVE · key=cron"
    description: crontab executed and the spool file written
    fields:
      exe: '/usr/bin/crontab'
      name: '/var/spool/cron/crontabs/<user> (Debian) or /var/spool/cron/<user> (RHEL)'
  - source: syslog / journald
    event: "crontab[pid]: (<user>) REPLACE (<user>)"
    description: The cron package logs every crontab replacement
    fields:
      program: crontab
  - source: Sysmon for Linux
    event: "1 · ProcessCreate / 11 · FileCreate"
    description: crontab process and the spool file write
    fields:
      Image: '/usr/bin/crontab'
      TargetFilename: '/var/spool/cron/crontabs/<user>'
logging:
  - "auditd: -w /var/spool/cron -p wa -k cron and -w /etc/crontab -p wa -k cron"
  - "syslog / journald forwarded"
dfir_artifacts:
  - artifact: User crontab
    location: /var/spool/cron/crontabs/<user> or /var/spool/cron/<user>
    collect: crontab -l -u <user>
    purpose: The persistence entry and what it runs
  - artifact: System cron locations
    location: /etc/crontab, /etc/cron.d/, /etc/cron.{hourly,daily,weekly,monthly}/
    collect: ls -la /etc/cron* ; cat /etc/crontab
    purpose: Where root-level persistence hides
  - artifact: Cron execution log
    location: /var/log/syslog or /var/log/cron, journalctl -u cron
    collect: journalctl -u cron --since "-1h"
    purpose: Whether and when the entry already ran
gap:
  reason: RASD's rules and offline engine target Windows telemetry; no Linux log source is mapped yet.
  planned: >
    A linux/auditd log source in tools/mappings.yml and a rule for crontab writes by
    interactive users outside configuration management.
cleanup:
  actions:
    - Removes every crontab line containing the marker (or the empty crontab if nothing else was in it)
  verify: crontab -l contains no line with the marker
sample_output:
  console: |
    [T1053.003] Add a crontab line that echoes the marker every 30 minutes
    added crontab entry: */30 * * * * /bin/echo purplelab_1a2b3c4d >/dev/null 2>&1 # purplelab_1a2b3c4d
    [cleanup] verified: no crontab line contains purplelab_1a2b3c4d
  illustrative_events:
    - title: syslog line written by crontab (Debian format)
      event:
        line: "Oct 12 06:00:01 lab-lnx01 crontab[2481]: (labuser) REPLACE (labuser)"
dfir_playbook: dfir/playbooks/linux_persistence.md
