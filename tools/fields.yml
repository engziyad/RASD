# Field vocabulary per Sigma logsource (Sysmon / Windows event schema names).
# The linter uses it to catch typos and case mistakes: the offline engine is
# case-insensitive, but SIEM column names are not (KQL is case-sensitive).
process_creation: [EventID, UtcTime, ProcessGuid, ProcessId, Image, FileVersion, Description, Product, Company,
  OriginalFileName, CommandLine, CurrentDirectory, User, LogonGuid, LogonId, TerminalSessionId, IntegrityLevel,
  Hashes, ParentProcessGuid, ParentProcessId, ParentImage, ParentCommandLine, ParentUser, Computer]
process_access: [EventID, UtcTime, SourceProcessGUID, SourceProcessId, SourceThreadId, SourceImage, TargetProcessGUID,
  TargetProcessId, TargetImage, GrantedAccess, CallTrace, SourceUser, TargetUser, Computer]
registry_set: [EventID, EventType, UtcTime, ProcessGuid, ProcessId, Image, TargetObject, Details, User, Computer]
windows/security: [EventID, Channel, Computer, SubjectUserSid, SubjectUserName, SubjectDomainName, SubjectLogonId,
  TargetUserName, TargetDomainName, ServiceName, ServiceSid, TicketOptions, TicketEncryptionType, IpAddress, IpPort,
  Status, SubStatus, FailureReason, LogonGuid, TransmittedServices, LogonType, ProcessName, WorkstationName,
  Workstation, PreAuthType, TargetSid, ObjectServer, ObjectType, ObjectName, HandleId, AccessList, AccessMask,
  ProcessId, AuthenticationPackageName, LogonProcessName]
# OpenCanary (github.com/thinkst/opencanary) writes one JSON record per interaction with a decoy service:
# the top-level keys below, as opencanary/logger.py names them (logtype is the module's event code,
# src_host the client, dst_port the decoy service port, node_id the decoy's configured identity), and a
# nested logdata object whose keys depend on the module (USERNAME and PASSWORD for login attempts, PATH and
# USERAGENT for the web skins, FILENAME and AUDITACTION for the SMB share ...).
opencanary/honeypot: [logtype, node_id, src_host, src_port, dst_host, dst_port, utc_time, local_time, local_time_adjusted,
  honeycred, logdata.USERNAME, logdata.PASSWORD, logdata.PATH, logdata.USERAGENT, logdata.HOSTNAME, logdata.SKIN,
  logdata.LOCALVERSION, logdata.REMOTEVERSION, logdata.SESSION, logdata.FILENAME, logdata.AUDITACTION, logdata.SHARENAME,
  logdata.REMOTENAME, logdata.FUNCTION, logdata.DATA]
windows/system: [EventID, Channel, Computer, Provider_Name, ServiceName, ImagePath, ServiceType, StartType,
  AccountName, SubjectUserName, SubjectDomainName, Channel_Cleared]
webserver: [c-ip, cs-username, cs-method, cs-uri-stem, cs-uri-query, sc-status, sc-bytes, cs-referer,
  cs-user-agent, cs-host, s-ip, time-taken]
linux/process_creation: [EventID, UtcTime, ProcessGuid, ProcessId, Image, CommandLine, CurrentDirectory, User,
  LogonGuid, LogonId, ParentProcessGuid, ParentProcessId, ParentImage, ParentCommandLine, ParentUser, Computer]
